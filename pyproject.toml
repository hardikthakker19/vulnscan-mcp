[project]
name = "vulnscan-mcp"
version = "0.1.0"
description = "Vulnerability Intelligence MCP Server with Automated Ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx[http2]>=0.27.0",
    "aiosqlite>=0.20.0",
    "tenacity>=8.3.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
vulnscan-mcp = "vulnscan.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnscan"]


[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
